[project]
name = "tab-cli"
version = "0.2.1"
description = "A CLI tool for tabular data"
authors = [{name = "Tongfei Chen", email = "tongfei@pm.me"}]
readme = "README.md"
repository = "https://github.com/tongfei/tab"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=20.0",
    "jmespath>=1.0",
    "typer>=0.21",
    "rich>=14.0",
    "blobfile>=3.0",
    "polars-fastavro>=0.5.1",
    "fsspec>=2026.1.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
s3 = ["s3fs>=2026.1.0", "boto3>=1.28.0"]
gs = ["gcsfs>=2026.1.0", "google-auth>=2.27.0"]
az = ["adlfs>=2026.1.0", "azure-identity>=1.10.0"]
duckdb = ["duckdb>=1.0.0"]
sqlite = ["adbc-driver-sqlite>=1.0.0"]
all = [
    "s3fs>=2025.1.0",
    "boto3>=1.28.0",
    "gcsfs>=2025.1.0",
    "google-auth>=2.27.0",
    "adlfs>=2025.1.0",
    "azure-identity>=1.10.0",
    "duckdb>=1.0.0",
    "adbc-driver-sqlite>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "mkdocs-material>=9.0.0",
    "pytest>=8.0",
]

[project.scripts]
tab = "tab_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tab_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
